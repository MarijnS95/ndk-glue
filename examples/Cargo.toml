[package]
name = "examples"
version = "0.1.0"
authors = ["The Rust Windowing contributors"]
edition = "2021"
publish = false

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4.14"
ndk-sys = "0.6"
ndk = { version = "0.9", features = ["api-level-23"] }
ndk-glue = { path = "../ndk-glue", features = ["logger"] }
rustix = { version = "1.0", default-features = false, features = ["std", "pipe", "stdio"] }

[[example]]
name = "hello_world"
crate-type = ["cdylib"]

[[example]]
name = "looper"
crate-type = ["cdylib"]

[package.metadata.android.sdk]
min_sdk_version = 16
target_sdk_version = 29
